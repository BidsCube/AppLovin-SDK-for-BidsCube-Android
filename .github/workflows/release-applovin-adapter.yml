# Build and release AppLovin Bidscube Adapter on tag applovin-adapter-v*
name: Release AppLovin Bidscube Adapter

on:
  push:
    tags:
      - 'applovin-adapter-v*'
  workflow_dispatch: {}

jobs:
  build-and-release:
    name: Build adapter and create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for softprops/action-gh-release (create/update release + upload assets)
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # workflow_dispatch defaults to a branch (e.g. main); ref_name must be a tag or the release action breaks.
      - name: Require tag ref for manual runs
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
        run: |
          echo "::error::Select a tag under \"Use workflow from\" (e.g. applovin-adapter-v1.2.6), not branch '${{ github.ref_name }}'. Or push a tag: git push origin applovin-adapter-vX.Y.Z"
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute for Gradle wrapper (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "gradlew present"
          fi

      - name: Ensure Gradle is available (if no gradlew)
        id: gradle_setup
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "No gradlew — installing Gradle on runner"
            sudo apt-get update -y
            sudo apt-get install -y wget unzip
            GRADLE_VER=8.11.1
            GRADLE_ZIP=gradle-${GRADLE_VER}-bin.zip
            wget -q "https://services.gradle.org/distributions/${GRADLE_ZIP}" -P /tmp
            sudo unzip -o /tmp/${GRADLE_ZIP} -d /opt/gradle
            echo "GRADLE_HOME=/opt/gradle/gradle-${GRADLE_VER}" >> $GITHUB_ENV
            echo "PATH=/opt/gradle/gradle-${GRADLE_VER}/bin:$PATH" >> $GITHUB_ENV
            echo "gradlew_missing=true" >> $GITHUB_OUTPUT
          else
            echo "gradlew_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Gradle wrapper (when missing)
        if: steps.gradle_setup.outputs.gradlew_missing == 'true'
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x ./gradlew
          echo "Created gradlew"

      - name: Install Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip lib32z1 lib32stdc++6
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || {
            echo "Failed to install Android SDK packages"
            exit 1
          }
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "Android SDK installed"

      - name: Set adapter version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#applovin-adapter-v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive version from tag '$TAG'"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Verify release version is set
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::BidscubeAdapterVersion would be empty. Run from tag applovin-adapter-vX.Y.Z."
            exit 1
          fi

      - name: Build, stage AARs, and run SDK Doctor
        env:
          BidscubeVersion: ${{ steps.version.outputs.version }}
          BidscubeAdapterVersion: ${{ steps.version.outputs.version }}
        run: ./gradlew clean sdkDoctorRelease -PskipSigning=true --no-daemon --stacktrace

      - name: Upload SDK Doctor reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-doctor-reports
          path: |
            build/reports/sdk-doctor.json
            build/reports/sdk-doctor.md

      - name: Create GitHub Release and upload AARs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AppLovin Bidscube MAX Adapter ${{ steps.version.outputs.version }}
          body: |
            **AppLovin Bidscube MAX adapter** ${{ steps.version.outputs.version }}

            Four adapter AAR modes. Pick **one** Maven coordinate — the matching SDK artifact is pulled transitively.

            | Mode | Maven coordinate |
            |------|------------------|
            | LiteNoVideo | `com.bidscube:applovin-bidscube-max-adapter-lite-no-video:${{ steps.version.outputs.version }}` |
            | WebViewVideoNoDesugar | `com.bidscube:applovin-bidscube-max-adapter-webview-video:${{ steps.version.outputs.version }}` |
            | LegacyMediaVideoNoDesugar | `com.bidscube:applovin-bidscube-max-adapter-legacy-media-video:${{ steps.version.outputs.version }}` |
            | FullWithVideo | `com.bidscube:applovin-bidscube-max-adapter-full-video:${{ steps.version.outputs.version }}` |

            MAX Dashboard class: `com.applovin.mediation.adapters.BidscubeMediationAdapter`

            Do **not** add a separate `bidscube-sdk` dependency when using Maven — the adapter POM includes the matching SDK artifact.

            See [CHANGELOG.md](CHANGELOG.md) and [applovin-adapter/README.md](applovin-adapter/README.md).
          files: |
            build/staged-aars/applovin-bidscube-max-adapter-lite-no-video-${{ steps.version.outputs.version }}.aar
            build/staged-aars/applovin-bidscube-max-adapter-webview-video-${{ steps.version.outputs.version }}.aar
            build/staged-aars/applovin-bidscube-max-adapter-legacy-media-video-${{ steps.version.outputs.version }}.aar
            build/staged-aars/applovin-bidscube-max-adapter-full-video-${{ steps.version.outputs.version }}.aar
            build/staged-aars/bidscube-sdk-lite-no-video-${{ steps.version.outputs.version }}.aar
            build/staged-aars/bidscube-sdk-webview-video-${{ steps.version.outputs.version }}.aar
            build/staged-aars/bidscube-sdk-legacy-media-video-${{ steps.version.outputs.version }}.aar
            build/staged-aars/bidscube-sdk-full-video-${{ steps.version.outputs.version }}.aar
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
