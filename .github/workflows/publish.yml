name: Fast Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create releases
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Gradle is available (if no gradlew)
        id: gradle_setup
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "No gradlew — installing Gradle 8.11.1"
            sudo apt-get update -y
            sudo apt-get install -y wget unzip
            wget -q "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" -P /tmp
            sudo unzip -o /tmp/gradle-8.11.1-bin.zip -d /opt/gradle
            echo "PATH=/opt/gradle/gradle-8.11.1/bin:$PATH" >> $GITHUB_ENV
            echo "gradlew_missing=true" >> $GITHUB_OUTPUT
          else
            chmod +x ./gradlew
            echo "gradlew_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Gradle wrapper (when missing)
        if: steps.gradle_setup.outputs.gradlew_missing == 'true'
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x ./gradlew

      - name: Install Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip lib32z1 lib32stdc++6
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build SDK and AppLovin adapter AARs
        run: ./gradlew clean :sdk:stageReleaseAars :applovin-adapter:assembleRelease --no-daemon --stacktrace

      - name: Verify AARs
        run: |
          if [ ! -f "applovin-adapter/build/outputs/aar/applovin-adapter-release.aar" ]; then
            echo "applovin-adapter-release.aar missing"; exit 1
          fi
          for core in \
            sdk/build/staged-aars/bidscube-sdk-lite-no-video-*.aar \
            sdk/build/staged-aars/bidscube-sdk-webview-video-*.aar \
            sdk/build/staged-aars/bidscube-sdk-legacy-media-video-*.aar \
            sdk/build/staged-aars/bidscube-sdk-full-video-*.aar; do
            if ! compgen -G "$core" > /dev/null; then
              echo "Missing staged core AAR pattern: $core"
              ls -la sdk/build/staged-aars/ 2>/dev/null || true
              exit 1
            fi
          done

      - name: Create GitHub Release and upload AARs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            **Bidscube** ${{ github.ref_name }}

            - **Direct SDK:** core Android AAR-и публікуються як чотири mode-specific артефакти в `sdk/build/staged-aars/`.
            - **AppLovin MAX:** Maven — додайте лише `com.bidscube:applovin-bidscube-adapter` (транзитивно підтягується `sdk-full-video`). Для GitHub AAR install беріть `applovin-adapter-release.aar` і потрібний core AAR під ваш Android mode.
          files: |
            applovin-adapter/build/outputs/aar/applovin-adapter-release.aar
            sdk/build/staged-aars/bidscube-sdk-lite-no-video-*.aar
            sdk/build/staged-aars/bidscube-sdk-webview-video-*.aar
            sdk/build/staged-aars/bidscube-sdk-legacy-media-video-*.aar
            sdk/build/staged-aars/bidscube-sdk-full-video-*.aar
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
